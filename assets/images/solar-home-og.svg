<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="og-title">
  <title id="og-title">Illustration of a row of two-storey houses with driveways between them, one with rooftop solar panels facing the sun</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf4"/>
      <stop offset="100%" stop-color="#eef0e4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- sun: upper right, same side the hero house's solar panels face -->
  <circle cx="1080" cy="120" r="62" fill="#e3b23c"/>

  <g transform="translate(60,80)">

    <!-- ground / street -->
    <rect x="-60" y="410" width="1200" height="10" fill="#1d241f" opacity="0.15"/>
    <rect x="-60" y="420" width="1200" height="130" fill="#255c3b"/>

    <!-- house 1 -->
    <g>
      <rect x="20" y="210" width="170" height="170" fill="#8a5a44" stroke="#1d241f" stroke-width="5"/>
      <polygon points="20,210 105,110 190,210" fill="#5c3a2a" stroke="#1d241f" stroke-width="5" stroke-linejoin="round"/>
      <!-- second-storey windows -->
      <rect x="45" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="60" y1="225" x2="60" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="135" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="150" y1="225" x2="150" y2="265" stroke="#1d241f" stroke-width="2"/>
      <!-- first-storey windows -->
      <rect x="45" y="295" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="60" y1="295" x2="60" y2="335" stroke="#1d241f" stroke-width="2"/>
      <!-- door -->
      <rect x="130" y="315" width="36" height="65" fill="#5c3a2a" stroke="#1d241f" stroke-width="3"/>
      <circle cx="159" cy="348" r="2.5" fill="#e3b23c"/>
    </g>

    <!-- driveway 1: between house 1 and hero house, with a car -->
    <g>
      <rect x="190" y="380" width="40" height="40" fill="#9a978a" stroke="#1d241f" stroke-width="2"/>
      <g>
        <rect x="193" y="392" width="34" height="12" rx="3" fill="#8a2e2e" stroke="#12190f" stroke-width="1.5"/>
        <path d="M 200,392 L 205,386 L 216,386 L 221,392 Z" fill="#8a2e2e" stroke="#12190f" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="201" cy="404" r="4" fill="#12190f"/>
        <circle cx="219" cy="404" r="4" fill="#12190f"/>
      </g>
    </g>

    <!-- hero house (cream, has solar on right/sun-facing slope) -->
    <g>
      <rect x="230" y="210" width="170" height="170" fill="#f7f4ec" stroke="#1d241f" stroke-width="5"/>
      <polygon points="230,210 315,110 400,210" fill="#255c3b" stroke="#1d241f" stroke-width="5" stroke-linejoin="round"/>

      <!-- solar panels on the RIGHT-facing roof slope (peak -> right eave), facing the sun.
           Corners are convex combinations of the roof triangle's own vertices, guaranteeing
           the array sits fully inside the roof regardless of proportions. -->
      <g stroke="#12190f" stroke-width="2" stroke-linejoin="round">
        <polygon points="325.2,122.0 387.2,195.0 340.1,199.5 296.6,148.4" fill="#1d3a6b"/>
        <line x1="340.71" y1="140.25" x2="307.50" y2="161.18" stroke="#12190f" stroke-width="1.5"/>
        <line x1="356.23" y1="158.50" x2="318.36" y2="173.95" stroke="#12190f" stroke-width="1.5"/>
        <line x1="371.74" y1="176.75" x2="329.22" y2="186.72" stroke="#12190f" stroke-width="1.5"/>
        <line x1="310.92" y1="135.20" x2="363.66" y2="197.25" stroke="#12190f" stroke-width="1.5"/>
        <line x1="319.49" y1="127.28" x2="345.74" y2="158.16" stroke="#eef0e4" stroke-width="3" opacity="0.85"/>
      </g>

      <!-- second-storey windows -->
      <rect x="250" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="265" y1="225" x2="265" y2="265" stroke="#1d241f" stroke-width="2"/>
      <!-- bay window, first storey -->
      <rect x="245" y="300" width="55" height="65" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="272" y1="300" x2="272" y2="365" stroke="#1d241f" stroke-width="2"/>
      <line x1="245" y1="330" x2="300" y2="330" stroke="#1d241f" stroke-width="2"/>
      <!-- door -->
      <rect x="335" y="320" width="36" height="60" fill="#255c3b" stroke="#1d241f" stroke-width="3"/>
      <circle cx="364" cy="352" r="2.5" fill="#e3b23c"/>
    </g>

    <!-- driveway 2: between hero house and house 3 -->
    <g>
      <rect x="400" y="380" width="40" height="40" fill="#9a978a" stroke="#1d241f" stroke-width="2"/>
    </g>

    <!-- house 3 -->
    <g>
      <rect x="440" y="210" width="170" height="170" fill="#6b7a63" stroke="#1d241f" stroke-width="5"/>
      <polygon points="440,210 525,110 610,210" fill="#3f4a3a" stroke="#1d241f" stroke-width="5" stroke-linejoin="round"/>
      <rect x="465" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="480" y1="225" x2="480" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="555" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="570" y1="225" x2="570" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="465" y="295" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="480" y1="295" x2="480" y2="335" stroke="#1d241f" stroke-width="2"/>
      <rect x="545" y="315" width="36" height="65" fill="#3f4a3a" stroke="#1d241f" stroke-width="3"/>
      <circle cx="574" cy="348" r="2.5" fill="#e3b23c"/>
    </g>

    <!-- driveway 3: between house 3 and house 4, with a car -->
    <g>
      <rect x="610" y="380" width="40" height="40" fill="#9a978a" stroke="#1d241f" stroke-width="2"/>
      <g>
        <rect x="613" y="392" width="34" height="12" rx="3" fill="#3a4a5c" stroke="#12190f" stroke-width="1.5"/>
        <path d="M 620,392 L 625,386 L 636,386 L 641,392 Z" fill="#3a4a5c" stroke="#12190f" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="621" cy="404" r="4" fill="#12190f"/>
        <circle cx="639" cy="404" r="4" fill="#12190f"/>
      </g>
    </g>

    <!-- house 4 -->
    <g>
      <rect x="650" y="210" width="170" height="170" fill="#8a5a44" stroke="#1d241f" stroke-width="5"/>
      <polygon points="650,210 735,110 820,210" fill="#5c3a2a" stroke="#1d241f" stroke-width="5" stroke-linejoin="round"/>
      <rect x="675" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="690" y1="225" x2="690" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="765" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="780" y1="225" x2="780" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="765" y="295" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="780" y1="295" x2="780" y2="335" stroke="#1d241f" stroke-width="2"/>
      <rect x="675" y="315" width="36" height="65" fill="#5c3a2a" stroke="#1d241f" stroke-width="3"/>
      <circle cx="704" cy="348" r="2.5" fill="#e3b23c"/>
    </g>

    <!-- driveway 4: between house 4 and house 5 -->
    <g>
      <rect x="820" y="380" width="40" height="40" fill="#9a978a" stroke="#1d241f" stroke-width="2"/>
    </g>

    <!-- house 5 (partial, near canvas edge) -->
    <g>
      <rect x="860" y="210" width="150" height="170" fill="#6b7a63" stroke="#1d241f" stroke-width="5"/>
      <polygon points="860,210 935,110 1010,210" fill="#3f4a3a" stroke="#1d241f" stroke-width="5" stroke-linejoin="round"/>
      <rect x="885" y="225" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="900" y1="225" x2="900" y2="265" stroke="#1d241f" stroke-width="2"/>
      <rect x="885" y="295" width="30" height="40" fill="#e3b23c" stroke="#1d241f" stroke-width="3"/>
      <line x1="900" y1="295" x2="900" y2="335" stroke="#1d241f" stroke-width="2"/>
    </g>

  </g>
</svg>
