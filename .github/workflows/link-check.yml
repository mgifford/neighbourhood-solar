name: Link check

on:
  schedule:
    # Every Monday at 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py --config configs/neighbourhood.yaml --output _site

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.4.0
        with:
          args: >-
            --no-progress
            --config lychee.toml
            _site/**/*.html
          format: markdown
          output: lychee-report.md
          fail: true

      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color B60205 \
            --description "Automated weekly link check found a broken link" \
            --force
          existing=$(gh issue list --search "Broken links found on the site in:title" \
            --state open --label broken-links --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file lychee-report.md
          else
            gh issue create --title "Broken links found on the site" \
              --label broken-links --body-file lychee-report.md
          fi
